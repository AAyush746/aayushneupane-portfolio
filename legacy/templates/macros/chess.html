{%- macro chess_dom( style ) %}
<canvas id="chess-background" style="{{ style | default(value='') }}" aria-hidden="true"></canvas>
{%- endmacro %}


{%- macro chess_script() %}
<script>
  (function () {
    const canvas = document.getElementById("chess-background");
    if (!canvas || !canvas.getContext) return;

    const ctx = canvas.getContext("2d");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const supportsFilter = typeof ctx.filter === "string";

    // 24x24 vector silhouettes, drawn straight onto the canvas so no icon font
    // or network request is needed and the pieces stay crisp at every size.
    const SOURCES = {
      king: "M19,22H5V20H19V22M17,10C15.58,10 14.26,10.77 13.55,12H13V7H16V5H13V2H11V5H8V7H11V12H10.45C9.35,10.09 6.9,9.43 5,10.54C3.07,11.64 2.42,14.09 3.5,16C4.24,17.24 5.57,18 7,18H17A4,4 0 0,0 21,14A4,4 0 0,0 17,10Z",
      queen:
        "M18,3A2,2 0 0,1 20,5C20,5.81 19.5,6.5 18.83,6.82L17,13.15V18H7V13.15L5.17,6.82C4.5,6.5 4,5.81 4,5A2,2 0 0,1 6,3A2,2 0 0,1 8,5C8,5.5 7.82,5.95 7.5,6.3L10.3,9.35L10.83,5.62C10.33,5.26 10,4.67 10,4A2,2 0 0,1 12,2A2,2 0 0,1 14,4C14,4.67 13.67,5.26 13.17,5.62L13.7,9.35L16.47,6.29C16.18,5.94 16,5.5 16,5A2,2 0 0,1 18,3M5,20H19V22H5V20Z",
      rook: "M5,20H19V22H5V20M17,2V5H15V2H13V5H11V2H9V5H7V2H5V8H7V18H17V8H19V2H17Z",
      bishop:
        "M19,22H5V20H19V22M17.16,8.26C18.22,9.63 18.86,11.28 19,13C19,15.76 15.87,18 12,18C8.13,18 5,15.76 5,13C5,10.62 7.33,6.39 10.46,5.27C10.16,4.91 10,4.46 10,4A2,2 0 0,1 12,2A2,2 0 0,1 14,4C14,4.46 13.84,4.91 13.54,5.27C14.4,5.6 15.18,6.1 15.84,6.74L11.29,11.29L12.71,12.71L17.16,8.26Z",
      knight:
        "M19,22H5V20H19V22M13,2V2C11.75,2 10.58,2.62 9.89,3.66L7,8L9,10L11.06,8.63C11.5,8.32 12.14,8.44 12.45,8.9C12.47,8.93 12.5,8.96 12.5,9V9C12.8,9.59 12.69,10.3 12.22,10.77L7.42,15.57C6.87,16.13 6.87,17.03 7.43,17.58C7.69,17.84 8.05,18 8.42,18H17V6A4,4 0 0,0 13,2Z",
      pawn:
        "M19 22H5V20H19V22M16 18H8L10.18 10H8V8H10.72L10.79 7.74C10.1 7.44 9.55 6.89 9.25 6.2C8.58 4.68 9.27 2.91 10.79 2.25C12.31 1.58 14.08 2.27 14.74 3.79C15.41 5.31 14.72 7.07 13.2 7.74L13.27 8H16V10H13.82L16 18Z",
    };

    const NAMES = Object.keys(SOURCES);
    const SHAPES = NAMES.map((name) => new Path2D(SOURCES[name]));

    // Depth is layered so pieces read as small-and-far (low z) to large-and-near (high z).
    const MIN_SIZE = 17;
    const MAX_SIZE = 205;
    const MAX_BLUR = 2.6;
    const HOVER_RADIUS = 110;

    let pieces = [];
    let width = 0;
    let height = 0;
    let dpr = 1;
    let scrollY = window.scrollY || 0;
    let currentFilter = "none";
    let canvasMouseX = -9999;
    let canvasMouseY = -9999;


    function randomBetween(min, max) {
      return min + Math.random() * (max - min);
    }

    // A few pieces in front, a long tail of small ones behind them.
    function createPiece(index, total) {
      const ratio = total <= 1 ? 1 : index / (total - 1);
      return {
        shape: SHAPES[Math.floor(Math.random() * SHAPES.length)],
        z: Math.pow(Math.random(), 1.6) * 0.85 + 0.15 * ratio,
        x: Math.random(),
        y: Math.random(),
        speed: randomBetween(0.0036, 0.013),
        sway: randomBetween(0.18, 0.42),
        bob: randomBetween(0.08, 0.16),
        phase: Math.random() * Math.PI * 2,
        tilt: randomBetween(-6, 6),
        rot: randomBetween(-4, 4),
        scaleVar: randomBetween(0.92, 1.08),
        spinSpeed: randomBetween(0.12, 0.4) * (Math.random() > 0.5 ? 1 : -1),
        flare: randomBetween(0.5, 1),
        // White pieces are solid; black pieces keep a light rim so they stay
        // readable against the dark board.
        white: Math.random() > 0.42,
        hover: 0,
      };
    }

    function populate() {
      const total = width < 700 ? 18 : width < 1200 ? 28 : 36;
      pieces = [];
      for (let i = 0; i < total; i++) {
        pieces.push(createPiece(i, total));
      }
      // Draw far pieces first so near ones layer cleanly on top.
      pieces.sort((a, b) => a.z - b.z);
    }

    function resize() {
      const rect = canvas.getBoundingClientRect();
      width = Math.round(rect.width) || window.innerWidth;
      height = Math.round(rect.height) || window.innerHeight;
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function draw(time) {
      const elapsed = reduceMotion ? 0 : time * 0.001;

      ctx.clearRect(0, 0, width, height);

      // Hover influence - only affects pieces, not canvas view
      if (!reduceMotion && window.matchMedia("(pointer: fine)").matches) {
        for (let i = 0; i < pieces.length; i++) {
          const piece = pieces[i];
          const z = piece.z;
          const baseSize = MIN_SIZE + (MAX_SIZE - MIN_SIZE) * Math.pow(z, 1.7) * piece.scaleVar;
          const drift = (piece.y - elapsed * piece.speed * z + 1) % 1;
          const sway = Math.sin(elapsed * piece.sway + piece.phase);
          const bob = Math.sin(elapsed * piece.bob + piece.phase * 0.7);
          const scroll = Math.sin(scrollY * 0.0007 + piece.phase);

          const x =
            piece.x * width + sway * 16 * z + scroll * 28 * (0.35 + z);
          const y =
            drift * (height + baseSize * 2) -
            baseSize +
            scroll * 14 * (0.35 + z) +
            bob * 6 * z;

          const dx = canvasMouseX - x;
          const dy = canvasMouseY - y;
          const dist = Math.hypot(dx, dy);
          const want = dist < HOVER_RADIUS * (0.6 + z * 0.8) ? 1 : 0;
          piece.hover += (want - piece.hover) * 0.22;
        }
      } else {
        for (let i = 0; i < pieces.length; i++) {
          pieces[i].hover += (0 - pieces[i].hover) * 0.25;
        }
      }

      for (let i = 0; i < pieces.length; i++) {
        const piece = pieces[i];
        const z = piece.z;
        const baseSize = MIN_SIZE + (MAX_SIZE - MIN_SIZE) * Math.pow(z, 1.7) * piece.scaleVar;
        const hoverLift = piece.hover * 14 * (0.8 + z);
        const size = baseSize * (1 + piece.hover * 0.26);
        const scale = size / 24;

        // Slow upward drift, wrapped so the field never empties out.
        const drift = (piece.y - elapsed * piece.speed * z + 1) % 1;
        const sway = Math.sin(elapsed * piece.sway + piece.phase);
        const bob = Math.sin(elapsed * piece.bob + piece.phase * 0.7);
        const wobble = Math.sin(elapsed * (piece.bob + 0.12) + piece.phase * 2.1);
        const scroll = Math.sin(scrollY * 0.0007 + piece.phase);

        const x =
          piece.x * width + sway * 18 * z + wobble * 8 * z + scroll * 28 * (0.35 + z);
        const y =
          drift * (height + baseSize * 2) -
          baseSize +
          scroll * 14 * (0.35 + z) +
          bob * 9 * z -
          hoverLift;

        const mx = (canvasMouseX - x) / Math.max(1, size);
        const my = (canvasMouseY - y) / Math.max(1, size);
        const tiltX = piece.tilt + sway * 3 + scroll * 1.8 + my * (-9 * piece.hover - 4 * z);
        const tiltY = piece.rot + mx * (6 * piece.hover + 3 * z);
        const tiltZ = (mx * 9 + my * 4) * piece.hover;

        // Depth is conveyed by fading far pieces, not by blurring them, so the
        // silhouettes stay perfectly crisp at every size.
        const alpha = 0.4 + 0.6 * z + piece.hover * 0.26;
        // How solid the extruded body is; distant pieces are flatter.
        const solid = 0.35 + z * 0.65;

        ctx.save();
        ctx.translate(x, y + size / 2);
        ctx.rotate((tiltX * Math.PI) / 180);
        ctx.rotate((tiltY * Math.PI) / 180);
        ctx.rotate((tiltZ * Math.PI) / 180);

        // Slow turn about the vertical axis: compress width and add a touch of
        // shear so the silhouette sweeps rather than merely sliding.
        const yaw = Math.sin(elapsed * piece.spinSpeed + piece.phase * 1.3) * (0.5 + piece.hover * 0.35);
        const squash = 0.74 + 0.26 * Math.abs(Math.cos(yaw));
        ctx.transform(squash, 0, Math.sin(yaw) * 0.12, 1, 0, 0);
        ctx.scale(scale, scale);

        // Light source sits up-left and shifts with the tilt.
        const lightX = -6 + tiltY * 0.22;
        const lightY = -11 + tiltX * 0.18;

        // Crisp grounded shadow (fixed pixel blur, never scaled by the CTM).
        ctx.save();
        ctx.globalAlpha = alpha * (0.5 + piece.hover * 0.3);
        ctx.fillStyle = "#000000";
        ctx.shadowColor = "rgba(0,0,0,0.75)";
        ctx.shadowBlur = 5 + z * 9 + piece.hover * 14;
        ctx.shadowOffsetX = 2 + piece.hover * 4;
        ctx.shadowOffsetY = 3 + z * 4 + piece.hover * 6;
        ctx.fill(piece.shape);
        ctx.restore();

        // Extruded 3D body: crisp stacked slices drawn back-to-front. Each slice
        // is a flat shade, so hard edges never smear into a blur.
        const layers = 12;
        const depthLen = (1.6 + z * 3.6) * (0.7 + piece.hover * 0.7);
        for (let d = layers; d >= 1; d--) {
          const f = d / layers;
          const base = piece.white ? 236 : 34;
          const edge = piece.white ? 150 : 6;
          const c = Math.round(edge + (base - edge) * (1 - f));
          ctx.globalAlpha = alpha * (0.5 + 0.4 * z);
          ctx.fillStyle = `rgb(${c},${c},${c})`;
          ctx.save();
          ctx.translate(depthLen * 0.3 * f, depthLen * f);
          ctx.fill(piece.shape);
          ctx.restore();
        }

        // Top face with a rounded gradient.
        const g = ctx.createLinearGradient(lightX - 7, lightY - 5, 5, 12);
        if (piece.white) {
          g.addColorStop(0, "rgba(255,255,255,1)");
          g.addColorStop(0.45, "rgba(244,244,244,1)");
          g.addColorStop(1, "rgba(205,205,205,1)");
        } else {
          g.addColorStop(0, "rgba(64,64,64,1)");
          g.addColorStop(0.45, "rgba(26,26,26,1)");
          g.addColorStop(1, "rgba(5,5,5,1)");
        }
        ctx.globalAlpha = alpha;
        ctx.fillStyle = g;
        ctx.fill(piece.shape);

        // Specular sheen clipped to the silhouette sells the curved surface.
        ctx.save();
        ctx.clip(piece.shape);
        const hi = ctx.createRadialGradient(lightX, lightY, 0.5, lightX, lightY, 13);
        hi.addColorStop(0, piece.white ? "rgba(255,255,255,0.85)" : "rgba(175,175,175,0.6)");
        hi.addColorStop(0.45, piece.white ? "rgba(255,255,255,0.2)" : "rgba(140,140,140,0.12)");
        hi.addColorStop(1, "rgba(255,255,255,0)");
        ctx.globalAlpha = alpha * (0.75 + piece.hover * 0.5);
        ctx.fillStyle = hi;
        ctx.fillRect(-18, -20, 36, 42);
        ctx.restore();

        // Crisp rim light around the edge, brighter on hover.
        ctx.globalAlpha = Math.min(1, alpha + 0.3 + piece.hover * 0.35);
        ctx.strokeStyle = piece.white
          ? `rgba(255,255,255,${(0.4 + piece.hover * 0.4).toFixed(3)})`
          : `rgba(220,220,220,${(0.22 + piece.hover * 0.45).toFixed(3)})`;
        ctx.lineWidth = (1 + piece.hover * 0.5) / scale;
        ctx.stroke(piece.shape);

        ctx.restore();
      }

      ctx.globalAlpha = 1;
      ctx.filter = currentFilter = "none";
    }

    function loop() {
      // rAF is throttled while hidden, so just skip the work and keep the loop alive.
      if (!document.hidden) {
        draw(performance.now());
      }
      requestAnimationFrame(loop);
    }

    function onPointerMove(event) {
      const rect = canvas.getBoundingClientRect();
      canvasMouseX = event.clientX - rect.left;
      canvasMouseY = event.clientY - rect.top;
    }

    function onPointerLeave() {
      canvasMouseX = -9999;
      canvasMouseY = -9999;
    }

    resize();
    populate();

        let resizeTimer = 0;

    window.addEventListener("resize", function () {
      resize();
      // Re-dealing the pieces on every resize event would reshuffle the board
      // mid-drag, so wait for the window to settle.
      window.clearTimeout(resizeTimer);
      resizeTimer = window.setTimeout(populate, 200);
    });
    window.addEventListener("scroll", function () {
      scrollY = window.scrollY;
    }, { passive: true });
    if (window.matchMedia("(pointer: fine)").matches) {
      window.addEventListener("pointermove", onPointerMove, { passive: true });
      window.addEventListener("pointerleave", onPointerLeave, { passive: true });
    }

    if (reduceMotion) {
      draw(0);
    } else {
      requestAnimationFrame(loop);
    }
  })();
</script>
{%- endmacro %}
