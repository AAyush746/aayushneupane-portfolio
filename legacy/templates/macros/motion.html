{%- macro motion_script() %}
<script>
  (function () {
    function init() {
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const finePointer = window.matchMedia("(pointer: fine)").matches;

    // ---------------------------------------------------------------------
    // Smooth scrolling (Lenis) — skipped entirely for reduced-motion users.
    // ---------------------------------------------------------------------
    if (window.Lenis && !reduceMotion) {
      const lenis = new Lenis({
        duration: 1.1,
        easing: function (t) {
          return Math.min(1, 1.001 - Math.pow(2, -10 * t));
        },
        smoothWheel: true,
        anchors: true,
      });
      window.__lenis = lenis;

      function raf(time) {
        lenis.raf(time);
        requestAnimationFrame(raf);
      }
      requestAnimationFrame(raf);
    }

    // ---------------------------------------------------------------------
    // Scroll reveals
    // ---------------------------------------------------------------------
    // Once a reveal has played, its classes are dropped: that releases the
    // will-change hint and lets hovers/magnets drive transform with their own
    // transition instead of inheriting the (much slower) reveal one.
    function settleReveal(el) {
      function done(event) {
        if (event.target !== el) return;
        el.removeEventListener("transitionend", done);
        el.classList.remove("reveal", "is-in");
      }
      el.addEventListener("transitionend", done);
      // Fallback for the no-transition cases (e.g. reduced motion).
      setTimeout(function () {
        el.removeEventListener("transitionend", done);
        el.classList.remove("reveal", "is-in");
      }, 3000);
    }

    const revealables = document.querySelectorAll(".reveal, [data-reveal]");
    if (revealables.length) {
      if (reduceMotion || !("IntersectionObserver" in window)) {
        revealables.forEach(function (el) {
          el.classList.add("is-in");
          settleReveal(el);
        });
      } else {
        const observer = new IntersectionObserver(
          function (entries) {
            entries.forEach(function (entry) {
              if (entry.isIntersecting) {
                entry.target.classList.add("is-in");
                settleReveal(entry.target);
                observer.unobserve(entry.target);
              }
            });
          },
          { threshold: 0.15, rootMargin: "0px 0px -8% 0px" }
        );
        revealables.forEach(function (el) {
          observer.observe(el);
        });
      }
    }

    // ---------------------------------------------------------------------
    // Release hero elements once their intro finishes, so later transforms
    // (magnetic pull, hovers) are not pinned by the animation's fill state.
    // ---------------------------------------------------------------------
    document.querySelectorAll(".hero-rise").forEach(function (el) {
      el.addEventListener("animationend", function (event) {
        if (event.animationName !== "heroRise") return;
        el.style.animation = "none";
        el.classList.remove("hero-rise");
      });
    });

    // ---------------------------------------------------------------------
    // Magnetic buttons / links
    // ---------------------------------------------------------------------
    // Elements are attracted while the cursor is merely *near* them (within a
    // small radius), not only while it is directly on top — that is what makes
    // the pull feel physical instead of twitchy.
    if (finePointer && !reduceMotion) {
      const magnets = Array.prototype.slice.call(
        document.querySelectorAll(
          "[data-magnetic], .button--big, .cv-button, .icon-button, .socials a, .button"
        )
      );
      const strength = 0.25;
      const radius = 64; // proximity halo beyond the element box
      const maxPull = 14; // hard clamp so nothing ever flies off

      magnets.forEach(function (el) {
        el.setAttribute("data-magnetic", "");
      });

      let pointer = null;
      let queued = false;

      function resetMagnet(el) {
        if (!el.classList.contains("is-magnet")) return;
        el.classList.remove("is-magnet");
        el.style.transform = "";
      }

      function updateMagnets() {
        queued = false;
        if (!pointer) return;

        magnets.forEach(function (el) {
          const rect = el.getBoundingClientRect();
          if (!rect.width || !rect.height) {
            resetMagnet(el);
            return;
          }

          const near =
            pointer.x > rect.left - radius &&
            pointer.x < rect.right + radius &&
            pointer.y > rect.top - radius &&
            pointer.y < rect.bottom + radius;

          if (!near) {
            resetMagnet(el);
            return;
          }

          const relX = pointer.x - (rect.left + rect.width / 2);
          const relY = pointer.y - (rect.top + rect.height / 2);
          const pullX = Math.max(-maxPull, Math.min(maxPull, relX * strength));
          const pullY = Math.max(-maxPull, Math.min(maxPull, relY * strength));

          el.classList.add("is-magnet");
          el.style.transform =
            "translate(" + pullX.toFixed(2) + "px," + pullY.toFixed(2) + "px)";
        });
      }

      function queueUpdate() {
        if (queued) return;
        queued = true;
        requestAnimationFrame(updateMagnets);
      }

      function releaseAll() {
        pointer = null;
        magnets.forEach(resetMagnet);
      }

      window.addEventListener(
        "pointermove",
        function (event) {
          pointer = { x: event.clientX, y: event.clientY };
          queueUpdate();
        },
        { passive: true }
      );
      window.addEventListener("pointerleave", releaseAll);
      window.addEventListener("blur", releaseAll);
    }

    // ---------------------------------------------------------------------
    // Custom cursor
    // ---------------------------------------------------------------------
    if (finePointer && !reduceMotion) {
      const cursor = document.querySelector(".cursor");
      const dot = cursor && cursor.querySelector(".cursor__dot");
      const ring = cursor && cursor.querySelector(".cursor__ring");

      if (cursor && dot && ring) {
        document.documentElement.classList.add("has-custom-cursor");

        let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
        let ringPos = { x: mouse.x, y: mouse.y };
        let visible = false;

        window.addEventListener("pointermove", function (event) {
          mouse.x = event.clientX;
          mouse.y = event.clientY;
          if (!visible) {
            visible = true;
            cursor.classList.add("is-active");
          }
        });

        window.addEventListener("pointerdown", function () {
          cursor.classList.add("is-hover");
        });
        window.addEventListener("pointerup", function () {
          cursor.classList.remove("is-hover");
        });

        const hoverables = "a, button, [data-magnetic], input, textarea, .card";
        document.addEventListener("pointerover", function (event) {
          if (event.target.closest(hoverables)) cursor.classList.add("is-hover");
        });
        document.addEventListener("pointerout", function (event) {
          if (event.target.closest(hoverables)) cursor.classList.remove("is-hover");
        });

        function render() {
          ringPos.x += (mouse.x - ringPos.x) * 0.16;
          ringPos.y += (mouse.y - ringPos.y) * 0.16;
          dot.style.transform =
            "translate(" + mouse.x + "px," + mouse.y + "px) translate(-50%,-50%)";
          ring.style.transform =
            "translate(" + ringPos.x + "px," + ringPos.y + "px) translate(-50%,-50%)";
          requestAnimationFrame(render);
        }
        requestAnimationFrame(render);
      }
    }
    }

    // Deferred scripts (Lenis) run before DOMContentLoaded, so wait for it to
    // guarantee `window.Lenis` exists.
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  })();
</script>
{%- endmacro %}
